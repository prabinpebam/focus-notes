version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 10
    groups:
      tiptap: { patterns: ["@tiptap/*"] }
      react: { patterns: ["react", "react-dom", "@types/react*", "react-aria-components"] }
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }