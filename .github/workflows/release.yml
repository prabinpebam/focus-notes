# Release (DST-03, D-128): a tag v<x.y.z> builds the desktop installers on Windows, macOS and Linux,
# the web app bundle template instances deploy (D-98), the workspace template pinned to it, and an
# SBOM; smoke-tests them; writes SHA256SUMS; attests every file's build provenance; and drafts a
# GitHub Release with notes from the commits since the last tag. A person checks the draft and
# publishes it. Versions below 1.0.0 (stage exits) and suffixed versions are pre-releases.
#
# Dry run: a manual run (Actions -> release -> Run workflow, "dry run" ticked, the default) or a tag
# v<x.y.z>-dryrun[.n] builds, smoke-tests and checksums everything, and stops before attesting, so a
# dry run's files never carry an attestation (M2). Other tags that read like a dry run are refused.
#
# Windows first (D-112): only the Windows build must pass; macOS and Linux build and report without
# blocking. Unsigned until DSK-07: there are no signing secrets in this repository (PKG-04).
# No job restores a cache, so nothing another branch's run wrote reaches a release.
name: release
on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and smoke-test without attesting or drafting a release
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      dry-run: ${{ steps.v.outputs.dry-run }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every tag and commit, for the notes since the last release.
          fetch-depth: 0
          persist-credentials: false
      - id: v
        name: Version, tag and dry run
        env:
          DRY_RUN_INPUT: ${{ inputs.dry-run }}
        run: node tools/release/version.mjs
      - name: Release notes from the commits since the last tag
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          node tools/release/notes.mjs --tag "$TAG" --ref "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" > release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  desktop:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: ${{ matrix.os != 'windows-latest' }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # No signing identity exists here (DSK-07); don't look for one in the runner's keychain.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # setup-node caches by itself when package.json names a packageManager (L9).
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: node packages/tokens/build.mjs
      - name: Build the installers (unsigned until DSK-07)
        run: pnpm --filter @focus-notes/desktop run dist "-c.extraMetadata.version=$VERSION"
      # SEC-01: the Electron fuses, read back from the packaged executable (hardening.test.ts).
      - name: Check the packaged executable's fuses
        if: runner.os == 'Windows'
        run: pnpm exec vitest run apps/desktop/test/hardening.test.ts
      # The packaged app itself starts, shows a note, and carries its icon (packaged.spec.ts).
      - name: Packaged app smoke test
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        env:
          FOCUS_NOTES_E2E: "1"
          FOCUS_NOTES_E2E_EXE: ${{ github.workspace }}\apps\desktop\release\win-unpacked\focus-notes.exe
        run: pnpm exec playwright test e2e/packaged.spec.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asset-desktop-${{ matrix.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            !apps/desktop/release/__uninstaller*
          if-no-files-found: error

  web:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # The web app doesn't need the desktop shell's Electron binary.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # setup-node caches by itself when package.json names a packageManager (L9).
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: node packages/tokens/build.mjs
      - name: Build the web app, the page renderer and the publisher
        run: |
          pnpm --filter @focus-notes/web run build
          pnpm --filter @focus-notes/web run build:publish
      - name: Pack the web app bundle
        run: node tools/release/web-bundle.mjs pack --version "$VERSION" --out dist
      - name: Smoke-test the bundle's publisher, with nothing else installed
        run: node tools/release/web-bundle.mjs smoke "dist/focus-notes-web-$VERSION.tgz"
      - name: Pin the workspace template to this bundle
        run: node tools/release/template.mjs --version "$VERSION" --bundle "dist/focus-notes-web-$VERSION.tgz" --out dist
      - name: SBOM (CycloneDX)
        run: node tools/release/sbom.mjs --version "$VERSION" --out "dist/focus-notes-$VERSION.cdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asset-web
          path: dist/
          if-no-files-found: error

  # Every built file in one folder: each artifact downloads into its own, so two with the same file
  # name fail here instead of one silently replacing the other (L8). Read-only, dry runs included.
  collect:
    needs: [version, desktop, web]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: asset-*
          path: parts
      - name: One folder, no duplicate names, and checksums
        run: |
          dups=$(find parts -type f -printf '%f\n' | sort | uniq -d)
          if [ -n "$dups" ]; then
            echo "::error::More than one artifact has these files: $dups"
            exit 1
          fi
          mkdir dist
          find parts -type f -exec mv -t dist {} +
          cd dist
          sha256sum -- * > SHA256SUMS
          { echo "### Release assets"; echo '```'; cat SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error

  # Attestations only for a real release, so no dry run's files can ever pass a check (M2), in a job
  # that builds nothing and alone holds id-token. Check one with
  #   gh attestation verify <file> --repo prabinpebam/focus-notes \
  #     --signer-workflow prabinpebam/focus-notes/.github/workflows/release.yml --source-ref refs/tags/v<x.y.z>
  attest:
    needs: [version, collect]
    if: needs.version.outputs.dry-run == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

  # The only job that can write to the repository, and only on a tag that isn't a dry run. The
  # release environment's required reviewer and its v* tag policy are repository settings the owner
  # sets by hand (D-128); this file can't make them.
  release:
    needs: [version, collect, attest]
    if: needs.version.outputs.dry-run == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          # The tag must still name the commit this run built (the commits endpoint peels an
          # annotated tag), or the release would attach these files to a different commit (L6).
          tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" --jq .sha)
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::$TAG names $tagged, but this run built $GITHUB_SHA."
            exit 1
          fi
          flags=(--draft --verify-tag)
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "Focus Notes $VERSION" --notes-file notes/release-notes.md "${flags[@]}"