name: nightly
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node packages/tokens/build.mjs
      - name: Build unsigned installers
        run: pnpm --filter @focus-notes/desktop run dist
      # SEC-01: the Electron fuses, read back from the packaged executable (hardening.test.ts).
      - name: Check the packaged executable's fuses
        if: runner.os == 'Windows'
        run: pnpm exec vitest run apps/desktop/test/hardening.test.ts
      # The packaged app itself: it starts, shows a note, and carries its icon (packaged.spec.ts).
      - name: Packaged app smoke test
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        env:
          FOCUS_NOTES_E2E: "1"
          FOCUS_NOTES_E2E_EXE: ${{ github.workspace }}\apps\desktop\release\win-unpacked\focus-notes.exe
        run: pnpm exec playwright test e2e/packaged.spec.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: focus-notes-nightly-${{ matrix.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          retention-days: 14