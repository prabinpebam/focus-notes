name: flake-census
# The flake census (D-152): every Windows journey run N times across the four shards, to find the
# intermittent ones before they block a merge. Started by hand only (Actions → flake-census → Run
# workflow, or `gh workflow run flake-census.yml --ref <branch> -f repeat=5`), never on a push: a
# census with N = 5 takes the four runners about 40 minutes. Each shard uploads its Playwright JSON
# report; the summary job lists every journey that failed at least once, with its failure messages,
# in the run's summary and in the artifact flake-census-summary.
on:
  workflow_dispatch:
    inputs:
      repeat:
        description: How many times to run each journey (1 to 20)
        type: string
        default: "5"
      grep:
        description: Only the journeys whose title matches (optional)
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: flake-census-${{ github.ref }}
  cancel-in-progress: true
jobs:
  journeys:
    runs-on: windows-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # Passed through the environment, never into the script's text.
      REPEAT: ${{ inputs.repeat || '5' }}
      GREP: ${{ inputs.grep || '' }}
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch Electron
        timeout-minutes: 10
        working-directory: apps/desktop
        run: node -e "console.log(require('electron'))"
      - run: node packages/tokens/build.mjs
      - name: Build the desktop app
        run: pnpm --filter @focus-notes/desktop run build
      - name: Journeys, each run N times (shard ${{ matrix.shard }} of 4)
        timeout-minutes: 230
        working-directory: apps/desktop
        # Failures are what the census counts: the summary job reports them.
        continue-on-error: true
        run: |
          if ($env:REPEAT -notmatch '^([1-9]|1[0-9]|20)$') { throw "repeat must be 1 to 20" }
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\census" | Out-Null
          $env:PLAYWRIGHT_JSON_OUTPUT_NAME = "$env:GITHUB_WORKSPACE\census\shard-$env:SHARD.json"
          $grep = if ($env:GREP) { @("--grep", $env:GREP) } else { @() }
          pnpm exec playwright test "--shard=$env:SHARD/4" "--repeat-each=$env:REPEAT" --reporter=dot,json @grep
      - name: Keep the shard's report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: census-shard-${{ matrix.shard }}
          path: census/
  summary:
    needs: journeys
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: census-shard-*
          path: census
          merge-multiple: true
      - name: Summarize
        run: |
          node tools/flake-census.mjs census/shard-*.json --json census/summary.json > census/summary.md
          cat census/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flake-census-summary
          path: |
            census/summary.md
            census/summary.json
