name: Delete diagnostic (not a merge gate)
# Branch-only diagnostic (diag-delete-23nov): three D-400 Delete journeys on one Windows runner, to keep
# their sanitized failure evidence. Never merged; its head is not a CI gate result.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  delete-diagnostic:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git submodule update --init --depth 1 agentic-craft
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch Electron
        timeout-minutes: 10
        working-directory: apps/desktop
        run: node -e "console.log(require('electron'))"
      - run: node packages/tokens/build.mjs
      - name: Build the desktop app
        run: pnpm --filter @focus-notes/desktop run build
      - name: List the three selected journeys
        working-directory: apps/desktop
        shell: pwsh
        env:
          FOCUS_NOTES_E2E: "1"
        run: |
          $cli = node -e "console.log(require('module').createRequire(require('path').resolve('package.json')).resolve('@playwright/test/cli'))"
          $list = node $cli test --list --workers=1 --retries=0 "e2e[\\/]project-offline\.spec\.ts$" -g "D-400: actual (current|oauth|allSelected) "
          $list
          if (-not ($list -match '^Total: 3 tests in 1 file$')) { throw "Expected exactly three selected journeys" }
      - name: Three Delete journeys
        timeout-minutes: 10
        working-directory: apps/desktop
        shell: pwsh
        env:
          FOCUS_NOTES_E2E: "1"
        run: |
          $cli = node -e "console.log(require('module').createRequire(require('path').resolve('package.json')).resolve('@playwright/test/cli'))"
          node $cli test --workers=1 --retries=0 "e2e[\\/]project-offline\.spec\.ts$" -g "D-400: actual (current|oauth|allSelected) "
      - name: Keep test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: delete-diagnostic-results
          path: test-results/
