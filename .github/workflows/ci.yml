name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Windows first (D-112): only Windows must pass until the owner has accepted the Windows app.
    # macOS and Linux still run and report, but never fail the workflow, until the platform parity pass.
    continue-on-error: ${{ matrix.os != 'windows-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node packages/tokens/build.mjs
      - name: Repository checks (boundaries, chain, plan, licenses, ui:check)
        run: pnpm check
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build the desktop app
        run: pnpm --filter @focus-notes/desktop run build
      # Budgets are enforced on one fixed runner type (Performance and quality); macOS runners'
      # start times swing too far between runs to gate on, so they only report.
      - name: Budgets (QLT-05)
        if: runner.os == 'Windows'
        run: pnpm bench --check
      - name: Budgets, report only
        if: runner.os == 'macOS'
        run: pnpm bench
      - name: Journey tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:e2e
      - name: Journey tests
        if: runner.os != 'Linux'
        run: pnpm test:e2e
      # The web app's journeys gate on Windows (D-112); Linux runs them too, without blocking.
      - name: Web app journeys (Chromium)
        if: runner.os == 'Windows'
        run: |
          pnpm --filter @focus-notes/web exec playwright install chromium
          pnpm test:web
      - name: Web app journeys (Chromium, Linux)
        if: runner.os == 'Linux'
        run: |
          pnpm --filter @focus-notes/web exec playwright install --with-deps chromium
          pnpm test:web
      - name: Keep test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/