name: white-margin
# D-153: the screen-level check of the app-built window's shadow margin (e2e/white-margin.spec.ts),
# on its own so its captures come back in minutes; the full suite runs it too, in ci.yml.
on:
  push:
    branches: ["fix-white-margin"]
permissions:
  contents: read
concurrency:
  group: white-margin-${{ github.ref }}
  cancel-in-progress: true
jobs:
  margin:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch Electron
        timeout-minutes: 10
        working-directory: apps/desktop
        run: node -e "console.log(require('electron'))"
      - run: node packages/tokens/build.mjs
      - name: Build the desktop app
        run: pnpm --filter @focus-notes/desktop run build
      - name: The margin at the screen level
        timeout-minutes: 15
        working-directory: apps/desktop
        run: pnpm test:e2e e2e/white-margin.spec.ts
      - name: Keep the captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: white-margin
          path: test-results/
